<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Recordings</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Admin Header with Delete Button -->
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl shadow-xl flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-cyan-400">Admin Dashboard</h1>
        <p class="text-xs text-slate-400 mt-1">Real-time Visitor Logs & Video Recordings</p>
      </div>
      
      <!-- New Delete Button -->
      <button id="deleteAllBtn" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 border border-red-600/50 px-4 py-2 rounded-xl text-xs font-bold transition-all">
        Delete All Data
      </button>
    </div>

    <!-- Visitor Access Logs -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Visitor Access Logs</h2>
      <div id="logsContainer" class="space-y-2 max-h-60 overflow-auto">
        <p class="text-slate-500 text-xs italic">Loading access logs...</p>
      </div>
    </div>

    <!-- Recorded Videos -->
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4">
      <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Submitted Video Recordings</h2>
      <div id="videosContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-slate-500 text-xs italic">Loading video recordings...</p>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDc6F_094RHBXWlIjyO8lP_Y1IF3uDfCzU",
      authDomain: "gen-lang-client-0404390549.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0404390549-default-rtdb.firebaseio.com",
      projectId: "gen-lang-client-0404390549",
      storageBucket: "gen-lang-client-0404390549.firebasestorage.app",
      messagingSenderId: "878924381688",
      appId: "1:878924381688:web:3500ab452bd35ce4872a0d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const logsContainer = document.getElementById('logsContainer');
    const videosContainer = document.getElementById('videosContainer');
    const deleteAllBtn = document.getElementById('deleteAllBtn');

    // Delete Logic
    deleteAllBtn.addEventListener('click', () => {
      const confirmDelete = confirm("WARNING: This will permanently delete ALL data (Logs and Recordings) from the database. Are you sure?");
      if (confirmDelete) {
        const rootRef = ref(db, '/');
        remove(rootRef)
          .then(() => {
            alert("Database has been completely cleared.");
            location.reload(); // Refresh page to reflect changes
          })
          .catch((error) => {
            alert("Error clearing database: " + error.message);
          });
      }
    });

    // Fetch Logs
    onValue(ref(db, 'visits_log'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        logsContainer.innerHTML = "";
        Object.values(data).reverse().forEach(log => {
          const badgeColor = log.permission === "Granted" ? "text-green-400" : "text-red-400";
          logsContainer.innerHTML += `
            <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
              <p class="text-slate-300 font-medium">Visited: ${new Date(log.timestamp).toLocaleString()} (Req: ${log.durationRequested || 5}s)</p>
              <span class="font-bold ${badgeColor}">Permission: ${log.permission}</span>
            </div>
          `;
        });
      } else {
        logsContainer.innerHTML = `<p class="text-slate-500 text-xs italic">No logs found.</p>`;
      }
    });

    // Fetch Videos
    onValue(ref(db, 'recorded_videos'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        videosContainer.innerHTML = "";
        Object.values(data).reverse().forEach(item => {
          videosContainer.innerHTML += `
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3 shadow-md">
              <div class="flex justify-between items-center">
                <p class="text-[11px] text-slate-400 font-mono">Recorded: ${new Date(item.createdAt).toLocaleString()}</p>
                <span class="text-[10px] bg-cyan-500/10 text-cyan-400 px-2 py-0.5 rounded-md border border-cyan-500/20">${item.duration || 5}s Video</span>
              </div>
              <video controls src="${item.videoData}" class="w-full rounded-xl border border-slate-800 h-44 object-cover bg-black"></video>
            </div>
          `;
        });
      } else {
        videosContainer.innerHTML = `<p class="text-slate-500 text-xs italic">No recordings found.</p>`;
      }
    });
  </script>
</body>
</html>
